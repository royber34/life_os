<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --fg: #1f1e1b; --muted: #6a685f; --line: #e6e3d8; --accent: #b4532f; --link: #3f6f9f; --bg: #ffffff;
    --serif: ui-serif, Georgia, Cambria, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @page { size: A4; margin: 15mm 16mm 14mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 24px; }
  @media print { main { max-width: none; padding: 0; } }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  sup { font-size: 0.62em; line-height: 0; margin-left: 1px; }
  .op-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; font-size: 10.5pt; color: var(--muted); letter-spacing: 0.02em; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .op-brand { font-weight: 600; color: var(--fg); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 25pt; line-height: 1.18; margin: 20px 0 16px; text-wrap: balance; }
  .op-list { display: grid; }
  .op-f { display: grid; grid-template-columns: 30% 1fr; gap: 18px; padding: 13px 0; border-top: 1px solid var(--line); break-inside: avoid; }
  .op-f:first-child { border-top: 0; }
  .op-v { font-family: var(--serif); font-size: 23pt; line-height: 1.08; color: var(--accent); }
  .op-body { display: grid; gap: 4px; align-content: start; }
  .op-body h2 { font-size: 12.5pt; font-weight: 600; margin: 0; line-height: 1.3; }
  .op-label { margin: 0; font-size: 10.5pt; line-height: 1.45; color: var(--muted); }
  .op-means { margin: 2px 0 0; font-size: 11pt; line-height: 1.45; }
  .op-trail { font-size: 10pt; margin-top: 3px; }
  .op-foot { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 9px; font-size: 9.5pt; line-height: 1.45; color: var(--muted); display: grid; gap: 3px; }
  .op-foot p { margin: 0; }
  .op-way { color: var(--fg); }
  @media (max-width: 560px) {
    .op-f { grid-template-columns: 1fr; gap: 6px; }
    h1 { font-size: 21pt; }
    .op-v { font-size: 20pt; }
  }
</style>
</head>
<body>
<main>
<!--__BODY__-->
</main>
</body>
</html>
